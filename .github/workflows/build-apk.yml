name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.1

      - name: Check environment
        run: |
          python --version
          flet --version
          java -version
          echo "PATH=$PATH"

      - name: Build APK
        run: |
          set -x
          flet build apk

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" -type f -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HomeInventory-APK
          path: build/**/*.apk
          if-no-files-found: error